services:
  db:
    container_name: petfinder-db
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: petfinder

    ports:
      - "5432:5432"

    mem_limit: 512m
    memswap_limit: 512mb
    cpus: 0.75

    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=40

    shm_size: 256mb

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d petfinder"]
      interval: 30s
      timeout: 5s
      retries: 5

    env_file:
      - .env

volumes:
  pgdata:
    driver: local
    name: petfinder_pgdata
